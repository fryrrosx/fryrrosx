    <text class="sans" x="56" y="276" font-size="16" fill="#8A93A6">From native mobile apps and typed frontends down to backends,</text>
    <text class="sans" x="56" y="300" font-size="16" fill="#8A93A6">data layers, infrastructure — and the security holes in between.</text>

