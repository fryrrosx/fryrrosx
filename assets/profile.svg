<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="t d">
  <title id="t">fryrrosx — Software Developer &amp; Bug Bounty Hunter</title>
  <desc id="d">Profile card for fryrrosx. Software developer and bug bounty hunter. Languages: TypeScript, Python, Java, Swift, Kotlin, C, C++, Ruby. Web and data: HTML, Django, SQL. Platforms: iOS, Android, Linux. DevOps and cloud: Docker, Kubernetes, Terraform, GitHub Actions, AWS, Azure, GCP, Helm, Ansible, Nginx. Infrastructure and security: Kubernetes, Terraform, Bug Bounty, OWASP, Burp Suite, Web Security, Penetration Testing, Reverse Engineering.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>

    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="700" rx="28" />
    </clipPath>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <filter id="glow" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#CDBEFF" />
      <stop offset="45%" stop-color="#FFFFFF">
        <animate attributeName="offset" values="0.05;0.95;0.05" dur="7s" repeatCount="indefinite"
          calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" />
      </stop>
      <stop offset="100%" stop-color="#B9A8FF" />
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B6BFF" />
      <stop offset="55%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#F471B5" />
    </linearGradient>

    <linearGradient id="edgeSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="45%" stop-color="#C4B5FD" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#67E8F9" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0" />
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090D" stop-opacity="0" />
      <stop offset="100%" stop-color="#08090D" stop-opacity="0.66" />
    </linearGradient>

    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#7C5CFF" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0" />
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity="0.055" />
    </pattern>
  </defs>

